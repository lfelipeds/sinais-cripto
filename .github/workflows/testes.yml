name: Testes

# Roda os testes offline a cada mudança de código (não nos commits de estado do bot).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/data/**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q
