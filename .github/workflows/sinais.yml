name: Sinais

on:
  schedule:
    - cron: "11 0 * * *"      # 00:11 UTC (21:11 Brasília): logo após o fechamento diário → ciclo completo
    - cron: "41 */4 * * *"    # a cada 4 horas: checa stops e atualiza preços do painel
  workflow_dispatch:          # botão "Run workflow" (o painel tem um atalho "Rodar agora")
    inputs:
      liberar_trava:
        description: "Liberar a trava de queda (−15%) e recomeçar a medir a partir de agora"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sinais
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar sinais
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIBERAR_TRAVA: ${{ inputs.liberar_trava }}
        run: python -m sinais.run

      - name: Salvar estado
        run: |
          git config user.name "sinais-bot"
          git config user.email "sinais-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "estado $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
